name: Update data and publish

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 18:00 IST, Mon-Fri, after NSE bhavcopy is published
    - cron: "0 3 * * 6"       # Saturday 08:30 IST: full price re-sync + bigger fundamentals refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | full | analyze"
        default: daily
  push:
    branches: [main]
    paths: ["data/screener_exports/**", "app/**", "pipeline/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore level-history cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: levels-${{ github.run_id }}
          restore-keys: levels-
      - name: Pick mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then m="${{ github.event.inputs.mode }}";
          elif [ "${{ github.event_name }}" = "push" ]; then m=analyze;
          elif [ "${{ github.event.schedule }}" = "0 3 * * 6" ]; then m=weekly;
          else m=daily; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Run pipeline
        run: python pipeline/run.py ${{ steps.mode.outputs.mode }}
      - name: Commit raw data history
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "data: ${{ steps.mode.outputs.mode }} update $(date -u +%F)"
          git push || (git pull --rebase && git push)
      - run: python pipeline/build_site.py
      # Publish the built site to the 'site' branch (one commit, replaced each run).
      # Cloudflare Pages watches that branch and serves it behind Cloudflare Access.
      - name: Publish site branch
        run: |
          cd dist
          git init -q -b site
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "site build $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          rm -rf .git
      # GitHub Pages: only while the repository is public
      - name: Repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api repos/$GITHUB_REPOSITORY --jq .private)" >> "$GITHUB_OUTPUT"
      - if: steps.vis.outputs.private != 'true'
        uses: actions/configure-pages@v5
      - if: steps.vis.outputs.private != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        if: steps.vis.outputs.private != 'true'
        uses: actions/deploy-pages@v4
